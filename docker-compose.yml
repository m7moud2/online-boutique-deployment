services:
  redis-cart:
    image: redis:alpine
    container_name: boutique_redis_cart
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - boutique_net
    restart: unless-stopped

  emailservice:
    image: gcr.io/google-samples/microservices-demo/emailservice:v0.2.0
    container_name: boutique_emailservice
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

  checkoutservice:
    image: gcr.io/google-samples/microservices-demo/checkoutservice:v0.2.0
    container_name: boutique_checkoutservice
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    networks:
      - boutique_net
    restart: unless-stopped

  recommendationservice:
    image: gcr.io/google-samples/microservices-demo/recommendationservice:v0.2.0
    container_name: boutique_recommendationservice
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice
    networks:
      - boutique_net
    restart: unless-stopped

  frontend:
    image: gcr.io/google-samples/microservices-demo/frontend:v0.2.0
    container_name: boutique_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    networks:
      - boutique_net
    restart: unless-stopped

  paymentservice:
    image: gcr.io/google-samples/microservices-demo/paymentservice:v0.2.0
    container_name: boutique_paymentservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

  productcatalogservice:
    image: gcr.io/google-samples/microservices-demo/productcatalogservice:v0.2.0
    container_name: boutique_productcatalogservice
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

  cartservice:
    image: gcr.io/google-samples/microservices-demo/cartservice:v0.2.0
    container_name: boutique_cartservice
    environment:
      - PORT=7070
      - REDIS_ADDR=redis-cart:6379
      - LISTEN_ADDR=0.0.0.0
    depends_on:
      - redis-cart
    networks:
      - boutique_net
    restart: unless-stopped

  loadgenerator:
    image: gcr.io/google-samples/microservices-demo/loadgenerator:v0.2.0
    container_name: boutique_loadgenerator
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
    depends_on:
      - frontend
    networks:
      - boutique_net
    restart: unless-stopped

  currencyservice:
    image: gcr.io/google-samples/microservices-demo/currencyservice:v0.2.0
    container_name: boutique_currencyservice
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

  shippingservice:
    image: gcr.io/google-samples/microservices-demo/shippingservice:v0.2.0
    container_name: boutique_shippingservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

  adservice:
    image: gcr.io/google-samples/microservices-demo/adservice:v0.2.0
    container_name: boutique_adservice
    environment:
      - PORT=9555
      - DISABLE_PROFILER=1
    networks:
      - boutique_net
    restart: unless-stopped

networks:
  boutique_net:
    driver: bridge

volumes:
  redis_data:
